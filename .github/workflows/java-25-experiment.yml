name: Java 25 experiment

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run tests and fixed-evidence experiment
        run: bash experiment/run.sh
      - name: Upload run outputs for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-25-crap-experiment
          path: experiment/results/
          if-no-files-found: warn
